name: OCI Connection Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-oci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install oci-cli

      - name: Configure OCI Authentication
        run: |
          mkdir -p ~/.oci
          
          # Safely write the private key from secrets
          cat << 'EOF' > ~/.oci/key.pem
          ${{ secrets.OCI_KEY_FILE }}
          EOF
          chmod 600 ~/.oci/key.pem
          
          # Aggressively strip any accidental whitespace, carriage returns, or quotes from secrets
          USER_OCID=$(echo "${{ secrets.OCI_USER_OCID }}" | tr -d '[:space:]"')
          FINGERPRINT=$(echo "${{ secrets.OCI_FINGERPRINT }}" | tr -d '[:space:]"')
          TENANCY_OCID=$(echo "${{ secrets.OCI_TENANCY_OCID }}" | tr -d '[:space:]"')
          REGION=$(echo "${{ secrets.OCI_REGION }}" | tr -d '[:space:]"')
          
          # Create the config file using the cleaned variables
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=$USER_OCID
          fingerprint=$FINGERPRINT
          tenancy=$TENANCY_OCID
          region=$REGION
          key_file=/home/runner/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Verify Connection
        env:
          SUPPRESS_LABEL_WARNING: True
        run: |
          echo "Testing OCI CLI authentication..."
          oci iam region list --output table
