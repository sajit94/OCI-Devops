name: OCI Connection Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-oci:
    runs-on: ubuntu-latest
    environment: test-oci 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug Secret Loading
        env:
          TEST_SECRET: ${{ secrets.OCI_USER_OCID }}
        run: |
          if [ -z "$TEST_SECRET" ]; then
            echo "❌ ERROR: The secret is completely empty! GitHub Actions cannot see it."
            exit 1
          else
            echo "✅ The secret is populated (Length: ${#TEST_SECRET} characters)."
          fi

      - name: Set up OCI CLI
        uses: oracle-actions/setup-oci-cli@v1.1.1
        with:
          tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          user: ${{ secrets.OCI_USER_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          region: ${{ secrets.OCI_REGION }}
          key_file: ${{ secrets.OCI_KEY_FILE }}

      - name: Verify Connection
        run: |
          echo "Testing OCI CLI authentication..."
          oci iam region list --output table
