name: OCI Connection Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-oci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install oci-cli

      - name: Configure OCI Authentication
        run: |
          mkdir -p ~/.oci
          
          # Safely write the private key from secrets
          cat << 'EOF' > ~/.oci/key.pem
          ${{ secrets.OCI_KEY_FILE }}
          EOF
          chmod 600 ~/.oci/key.pem
          
          # Create the OCI config file using secrets
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=/home/runner/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Verify Connection
        env:
          SUPPRESS_LABEL_WARNING: True
        run: |
          echo "Testing OCI CLI authentication..."
          oci iam region list --output table
